name: CI

on:
  push:
  # Los PR desde forks no disparan `push` en este repo.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Build y pruebas con datos de ejemplo: sin esto, el build exigiría Supabase y Resend.
  APP_ENV: ci
  # Valores de ejemplo, sin secretos. El build público no necesita Supabase.
  NEXT_PUBLIC_SITE_URL: http://localhost:3100
  NEXT_PUBLIC_WHATSAPP_NUMBER: "50400000000"
  NEXT_PUBLIC_ALLOW_INDEXING: "false"

jobs:
  quality:
    name: Lint, tipos y tests de lógica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Datos de ejemplo al día con supabase/seed.sql
        run: pnpm db:seed --check
      - name: Vulnerabilidades en dependencias de producción
        run: pnpm audit --prod --audit-level=high

  database:
    name: Tests de RLS contra Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:rls
      - name: Tipos de la base al día con las migraciones
        run: pnpm db:types --check

  e2e:
    name: Build y pruebas de punta a punta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --trace off
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
